<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Embedded frame</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f7f9fc;
      }
      label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
      input { padding: 0.4rem; font: inherit; border: 1px solid #b9c2d4; border-radius: 0.35rem; }
      button { padding: 0.4rem 0.9rem; font: inherit; font-weight: 600; color: #fff; background: #2745b8; border: 0; border-radius: 0.35rem; cursor: pointer; }
      output { display: block; margin-top: 0.75rem; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Inside the iframe</h1>

    <form id="frame-form">
      <label for="frame-input">Frame input</label>
      <input id="frame-input" name="frameInput" type="text" data-testid="frame-input" />
      <button type="submit" data-testid="frame-submit">Send</button>
    </form>

    <output id="frame-output" data-testid="frame-output" role="status"></output>

    <script>
      document.getElementById('frame-form').addEventListener('submit', function (event) {
        event.preventDefault();
        var value = document.getElementById('frame-input').value;
        document.getElementById('frame-output').textContent = 'Frame received: ' + value;
      });
    </script>
  </body>
</html>
