<app-breadcrumbs
  [crumbs]="[
    { label: 'Home', link: '/' },
    { label: 'Sign in', link: '/auth/login' },
    { label: 'Reset password' },
  ]"
/>

<h1 class="page-title">Reset password</h1>

<p class="page-intro">
  The token is pre-filled from the <code>token</code> query parameter when present.
</p>

<div class="card" style="max-width: 32rem">
  @if (errorMessage()) {
    <div class="alert alert-error" role="alert" data-testid="reset-error">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="reset-token">Reset token</label>
      <input id="reset-token" type="text" formControlName="token" [attr.aria-invalid]="isInvalid('token')" />
      @if (isInvalid('token')) {
        <p class="field-error">A reset token is required</p>
      }
    </div>

    <div class="field">
      <label for="reset-password">New password</label>
      <input id="reset-password" type="password" formControlName="password" [attr.aria-invalid]="isInvalid('password')" />
      @if (isInvalid('password')) {
        <p class="field-error">Password must be at least 8 characters</p>
      }
    </div>

    <div class="row">
      <button type="submit" class="btn btn-primary" data-testid="reset-submit" [disabled]="pending()">
        @if (pending()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        Update password
      </button>

      <a routerLink="/auth/login">Back to sign in</a>
    </div>
  </form>
</div>
