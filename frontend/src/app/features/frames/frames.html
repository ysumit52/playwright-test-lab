<app-breadcrumbs [crumbs]="[{ label: 'Home', link: '/' }, { label: 'Frames & windows' }]" />

<h1 class="page-title">iFrames &amp; multi-window</h1>

<p class="page-intro">
  Embedded frames for <code>frameLocator()</code> and links that open new tabs so
  you can practise <code>context.waitForEvent('page')</code>.
</p>

<div class="stack">
  <section class="card" aria-labelledby="iframe-heading">
    <h2 id="iframe-heading">Embedded frame</h2>

    <iframe
      title="Embedded form frame"
      name="lab-frame"
      data-testid="lab-frame"
      [src]="frameUrl"
      width="100%"
      height="260"
    ></iframe>
  </section>

  <section class="card" aria-labelledby="nested-heading">
    <h2 id="nested-heading">Nested frame</h2>

    <p class="muted">This frame contains another frame inside it.</p>

    <iframe
      title="Nested frame wrapper"
      name="lab-nested-frame"
      data-testid="lab-nested-frame"
      [src]="nestedFrameUrl"
      width="100%"
      height="260"
    ></iframe>
  </section>

  <section class="card" aria-labelledby="window-heading">
    <h2 id="window-heading">New tabs and windows</h2>

    <div class="row">
      <a class="btn" href="/products" target="_blank" rel="noopener" data-testid="open-tab-products">
        Open Products in a new tab
      </a>

      <a class="btn" href="/api/forms/download/report.csv" target="_blank" rel="noopener" data-testid="open-tab-api">
        Open the CSV endpoint in a new tab
      </a>
    </div>
  </section>
</div>
